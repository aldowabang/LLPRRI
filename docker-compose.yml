services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rri-app
    ports:
      - "8002:80"
    volumes:
      - ./:/app
      - app_storage:/app/storage
      - /app/vendor
      - /app/node_modules
      - /app/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APP_URL=http://localhost:8002
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=rri_penjadwalan
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    restart: unless-stopped
    networks:
      - rri-network

  db:
    image: mysql:8.0
    container_name: rri-db
    platform: "linux/amd64"
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: rri_penjadwalan
    volumes:
      - rri_dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - rri-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: rri-phpmyadmin
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: secret
      UPLOAD_LIMIT: 500MB
      MAX_EXECUTION_TIME: 3600
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - rri-network

  waha:
    image: devlikeapro/waha
    container_name: rri-waha
    ports:
      - "3001:3000"
    environment:
      WAHA_DASHBOARD: "enabled"
    restart: unless-stopped
    networks:
      - rri-network

volumes:
  rri_dbdata:
  app_storage:

networks:
  rri-network:
    driver: bridge
